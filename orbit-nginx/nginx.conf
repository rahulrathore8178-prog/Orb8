# Routing:
#   /igris/...  -> Python (FastAPI) server, with the /igris prefix stripped
#   everything else (HTTP + WebSocket) -> Node servers, active/passive failover 1 -> 2 -> 3 -> 4
# Each Render service routes by Host header, so each hop sets its own Host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 10000;
    server_name _;   # <-- optional: put your public domain here, e.g. api.yourdomain.com

    client_max_body_size 20m;   # image / file uploads to Python (/postdata, /remember)

    # Re-resolve Render hostnames at runtime (also lets nginx start even if one host is down)
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Shared proxy settings (inherited by every location below)
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;     # fail fast so failover is quick
    proxy_read_timeout    3600s;  # keeps long-lived WebSockets (calls/chat) open
    proxy_send_timeout    3600s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- Python server: anything starting with /igris ----------
    # /igris/askPrompt -> Python receives /askPrompt (your FastAPI routes stay unchanged)
    # NOTE: `set` must come BEFORE `rewrite ... break`, otherwise the set is skipped.
    location ^~ /igris/ {
        set $python orb8-2gs7.onrender.com;      # <-- PYTHON SERVER HOST
        rewrite ^/igris/(.*)$ /$1 break;
        proxy_ssl_name $python;
        proxy_set_header Host $python;
        proxy_pass https://$python;
    }

    # /igris with no trailing slash -> Python "/"
    location = /igris {
        set $python orb8-2gs7.onrender.com;
        rewrite ^ / break;
        proxy_ssl_name $python;
        proxy_set_header Host $python;
        proxy_pass https://$python;
    }

    # ---------- Node servers: everything else ----------
    # Server 1 (primary) -- handles HTTP and WebSocket (ws:// upgrades hit "/")
    location / {
        set $backend orb8-6bfm.onrender.com;
        proxy_ssl_name $backend;
        proxy_set_header Host $backend;
        proxy_pass https://$backend;
        proxy_intercept_errors on;
        error_page 502 503 504 = @server2;
    }

    # Server 2 (used only if server 1 failed)
    location @server2 {
        set $backend orb8-0kmr.onrender.com;
        proxy_ssl_name $backend;
        proxy_set_header Host $backend;
        proxy_pass https://$backend;
        proxy_intercept_errors on;
        error_page 502 503 504 = @server3;
    }

    # Server 3 (used only if server 2 failed)
    location @server3 {
        set $backend orb8-oeih.onrender.com;
        proxy_ssl_name $backend;
        proxy_set_header Host $backend;
        proxy_pass https://$backend;
        proxy_intercept_errors on;
        error_page 502 503 504 = @server4;
    }

    # Server 4 (last resort)
    location @server4 {
        set $backend orb8.onrender.com;
        proxy_ssl_name $backend;
        proxy_set_header Host $backend;
        proxy_pass https://$backend;
    }
}